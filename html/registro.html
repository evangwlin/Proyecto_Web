<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Aurora Waves</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css?v=639167404711385714">
</head>
<body>

    <header class="navbar" style="justify-content: center;">
        <div class="nav-logo" style="flex: unset;"> 
            <a href="index.html" style="color: inherit; text-decoration: none; font-size: 1.5rem;"><span>Aurora Waves</span></a>
        </div>
    </header>

    <main>
        <section class="seccion-formulario" style="margin: 20px 0;">
            <div class="contenedor-formulario">
                <h2>Crear Cuenta</h2>
                <p>Convertite en parte del sonido.</p>
                
                <form class="formulario" id="form-registro" action="#" method="POST" novalidate>
                    
                    <div class="botones-sociales d-flex flex-column gap-2">
                        <button type="button" class="btn btn-outline-secondary w-100 mb-2 btn-social">
                            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="icono-social">
                            Google
                        </button>
                        <button type="button" class="btn btn-outline-secondary w-100 mb-2 btn-social">
                            <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook" class="icono-social">
                            Facebook
                        </button>
                    </div>

                    <div class="divisor-social">O registrate con tu email</div>

                    <div class="grupo-input mb-0">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" class="form-control input-formulario" placeholder="Tu nombre" required>
                        <span class="error-message"></span>
                    </div>

                    <div class="grupo-input mb-0">
                        <label for="username">Nombre de Usuario</label>
                        <input type="text" id="username" name="username" class="form-control input-formulario" placeholder="Ej: melomano_pro" required>
                        <span class="error-message"></span>
                    </div>

                    <div class="grupo-input mb-0">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" class="form-control input-formulario" placeholder="tu@email.com" required>
                        <span class="error-message"></span>
                    </div>

                    <div class="grupo-input mb-0">
                        <label for="nacimiento">Fecha de Nacimiento</label>
                        <input type="date" id="nacimiento" name="nacimiento" class="form-control input-formulario" required style="color-scheme: dark;">
                        <span class="error-message"></span>
                    </div>

                    <div class="grupo-input mb-0">
                        <label for="password">Contraseña</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" class="form-control input-formulario" placeholder="••••••••" required>
                            <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                                <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            </button>
                        </div>
                        <span class="error-message"></span>
                    </div>

                    <div class="grupo-input mb-0">
                        <label for="confirm_password">Confirmar Contraseña</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirm_password" name="confirm_password" class="form-control input-formulario" placeholder="••••••••" required>
                            <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                                <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            </button>
                        </div>
                        <span class="error-message"></span>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-pill btn-submit" style="margin-top: 15px;">Registrarse</button>
                </form>
                <div class="formulario-footer">
                    ¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a>
                </div>
            </div>
        </section>
    </main>

    <!-- Lógica del Registro -->
    <script src="../jscrip/registro.js"></script>
</body>
</html>
