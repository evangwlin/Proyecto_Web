<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso - Super pagina pro musical</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css?v=639167404711385714">
</head>
<body>

    <header class="navbar" style="justify-content: center;">
        <div class="nav-logo" style="flex: unset;"> 
            <a href="index.html" style="color: inherit; text-decoration: none; font-size: 1.5rem;"><span>Logo</span></a>
        </div>
    </header>

    <main>
        <section class="seccion-formulario">
            <div class="contenedor-formulario">
                <h2>Iniciar Sesión</h2>
                <p>Ingresá para explorar tu música favorita.</p>
                <form class="formulario" action="#" method="POST">
                    
                    <div class="botones-sociales d-flex flex-column gap-2">
                        <button type="button" class="btn btn-outline-secondary w-100 mb-2 btn-social">
                            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="icono-social">
                            Google
                        </button>
                        <button type="button" class="btn btn-outline-secondary w-100 mb-2 btn-social">
                            <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook" class="icono-social">
                            Facebook
                        </button>
                    </div>

                    <div class="divisor-social">O continuá con tu email</div>

                    <div class="grupo-input mb-0">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" class="form-control input-formulario" placeholder="tu@email.com" required>
                    </div>
                    <div class="grupo-input mb-0">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" class="form-control input-formulario" placeholder="••••••••" required>
                    </div>
                    
                    <label class="recordarme-contenedor">
                        <div class="switch">
                            <input type="checkbox" id="recordarme">
                            <span class="slider-toggle"></span>
                        </div>
                        <span class="recordarme-texto">Recuérdame</span>
                    </label>

                    <button type="submit" class="btn btn-primary w-100 rounded-pill btn-submit">Ingresar</button>
                </form>
                <div class="formulario-footer">
                    ¿No tenés cuenta? <a href="registro.html">Registrate acá</a>
                </div>
            </div>
        </section>
    </main>

<!-- Footer removido -->

    <script src="script.js"></script>
</body>
</html>
